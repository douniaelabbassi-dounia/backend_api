<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>HR – Prédiction Salaire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Prédiction de Salaire</h1>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    {% if prediction %}
      <div class="alert success">
        Salaire prédit : <strong>{{ prediction }}</strong> MAD
      </div>
    {% endif %}

    <form method="post" action="{{ url_for('ui.predict_from_form') }}" class="grid">
      <label>Années d'expérience
        <input type="number" step="0.1" name="years_experience" required>
      </label>

      <label>Rôle
        <select name="role" required>
          {% for r in roles %}
            <option value="{{ r }}">{{ r }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Diplôme
        <select name="degree" required>
          {% for d in degrees %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Taille d'entreprise
        <select name="company_size" required>
          {% for s in company_sizes %}
            <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Localisation
        <select name="location" required>
          {% for l in locations %}
            <option value="{{ l }}">{{ l }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Niveau
        <select name="level" required>
          {% for lv in levels %}
            <option value="{{ lv }}">{{ lv }}</option>
          {% endfor %}
        </select>
      </label>

      <button type="submit">Prédire</button>
    </form>
  </div>
</body>
</html>
